name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run typecheck:tests
      - run: npm test

  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lens
          POSTGRES_PASSWORD: lens_ci
          POSTGRES_DB: lens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lens -d lens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://lens:lens_ci@localhost:5432/lens_test
      TEST_DATABASE_URL: postgres://lens:lens_ci@localhost:5432/lens_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run database migrations
        run: npm run db:migrate -w apps/stats-api
      - name: Run database tests
        run: >-
          npx vitest run apps/stats-api/src/postgresEventStore.test.ts
          --reporter=verbose --reporter=json --outputFile.json=db-test-results.json
      - name: Fail if any database test was skipped
        run: |
          node -e "
            const r = JSON.parse(require('fs').readFileSync('db-test-results.json', 'utf8'));
            if (r.numTotalTests === 0 || r.numPendingTests > 0) {
              console.error('DB tests skipped or missing: ' + r.numPendingTests + ' skipped of ' + r.numTotalTests);
              process.exit(1);
            }
            console.log('DB tests ran: ' + r.numPassedTests + ' passed');
          "
